upstream alioth_api {
    server alioth-api:8000;
}

upstream alioth_workstation {
    server alioth-workstation:80;
}

server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://alioth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 20m;

        # APK 上传单独放宽：前端承诺 500MB，后端上限默认 512MB
        # （ALIOTH_PLATFORM_BUILD_MAX_SIZE_BYTES）。这里略宽于后端，超限由后端给可读提示。
        # 其余 proxy_* 设置继承自外层，proxy_pass 不继承需重写。
        location = /api/v1/app-builds {
            proxy_pass http://alioth_api;
            client_max_body_size 520m;
            proxy_request_buffering off;
        }
    }

    location / {
        proxy_pass http://alioth_workstation;
        proxy_set_header Host $host;
    }
}


include /etc/nginx/alioth-extra/*.conf;
