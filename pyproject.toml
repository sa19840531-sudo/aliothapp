[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alioth"
version = "0.1.0"
description = "Alioth AI automated quality inspection platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.10.0",
    "agent-framework-openai==1.10.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "greenlet>=3.0,<4.0",
    "idna>=3.0,<4.0",
    "minio>=7.2,<8.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "pillow>=10.0,<13.0",
    "playwright>=1.62,<1.63",
    "pyee>=13,<14",
    "pydantic>=2.7,<3.0",
    "pyjwt>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "cryptography>=42,<51",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.20,<3.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.setuptools.package-data]
"services.api.app.infrastructure.device" = ["android/*.jar", "android/*.java"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # 历史 Airtest 脚本与采集资产保留作节奏参考，不作为 Python 主线质量门禁。
    "services/api/app/untitled.air",
    "services/api/resources/recording",
    # 一次性现场诊断脚本含环境探测命令，不进入应用质量门禁。
    "scripts/_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# mobile_demo_*.py 被 gitignore，CI 工作區沒有該檔。
# 不標成 first-party 時，ruff 會把它當第三方，和已入庫的 services 模組拆組，本機與流水線排序相反。
known-first-party = ["services"]

[tool.ruff.lint.per-file-ignores]
"services/api/migrations/versions/*.py" = ["E501"]
# 旧版 Agent 提示词包含面向模型的长行，保留原文并单独隔离该静态规则。
"services/api/app/api/v1/mobile_demo_agent_ad_capture.py" = ["E501"]
# Mobile Demo 内嵌 HTML/JavaScript 与历史原型长行保持原文，其他规则仍执行。
"services/api/app/api/v1/mobile_demo.py" = ["E501"]
# 体验平台报告模板：CSS/JS 逐字节移植自平台编辑器，不可折行
"services/api/app/application/experience_report_export.py" = ["E501"]
# 以下为历史设备适配、OpenAPI/HTML 模板和兼容性测试中的长字面量。
# 继续执行 F/I/UP/B 等规则，只隔离物理行宽，避免一次性重排影响设备脚本语义。
"services/api/app/agents/explorer/maf_agent.py" = ["E501"]
